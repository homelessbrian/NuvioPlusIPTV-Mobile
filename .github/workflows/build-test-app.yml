name: Build Test App

# Run it by hand from the Actions tab. The steps live in test-app-steps.yml and always come from the
# dev branch, so it works the same whichever branch "Use workflow from" is set to.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: false
        default: dev
        type: string
      notes:
        description: "What changed (blank = the last commit's title)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-test-build
  cancel-in-progress: true

jobs:
  build:
    uses: homelessbrian/NuvioPlusIPTV-Mobile/.github/workflows/test-app-steps.yml@dev
    with:
      branch: ${{ inputs.branch }}
      notes: ${{ inputs.notes }}
    secrets: inherit
